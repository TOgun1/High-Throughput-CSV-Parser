spring.application.name=csv-parser
# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommercedb?reWriteBatchedInserts=true
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings (For the Slow Approach)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# JDBC Template Settings (For the Fast Approach)
spring.jdbc.template.batch-size=10000


spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB